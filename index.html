<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2196F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="房租提醒 - 轻松管理租金账单">
    <title>房租提醒</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>房租提醒</h1>
        </header>

        <main class="main-content" id="mainContent">
            <div id="page-home" class="page active">
                <h2 class="page-title">待交租提醒</h2>
                <div id="rent-reminders" class="rent-list"></div>
                <div id="no-reminders" class="empty-state" style="display: none;">
                    <p>暂无待交租记录</p>
                </div>
            </div>

            <div id="page-tenants" class="page">
                <h2 class="page-title">房客管理</h2>
                <button class="btn btn-primary add-btn" onclick="showAddTenantModal()">+ 添加房客</button>
                <div id="tenant-list" class="tenant-list"></div>
                <div id="no-tenants" class="empty-state" style="display: none;">
                    <p>暂无房客，请添加房客</p>
                </div>
            </div>

            <div id="page-records" class="page">
                <h2 class="page-title">交租记录</h2>
                <div id="payment-records" class="record-list"></div>
                <div id="no-records" class="empty-state" style="display: none;">
                    <p>暂无交租记录</p>
                </div>
            </div>

            <div id="page-settings" class="page">
                <h2 class="page-title">设置</h2>
                <div class="settings-section">
                    <h3>提醒设置</h3>
                    <div class="setting-item">
                        <label>提前提醒天数</label>
                        <select id="reminder-days">
                            <option value="3">3天</option>
                            <option value="5" selected>5天</option>
                            <option value="7">7天</option>
                            <option value="14">14天</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>提醒时间</label>
                        <input type="time" id="reminder-time" value="09:00">
                    </div>
                </div>
                <div class="settings-section">
                    <h3>数据管理</h3>
                    <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">导入数据</button>
                    <input type="file" id="import-file" accept=".json" style="display: none" onchange="importData(event)">
                    <button class="btn btn-danger" onclick="clearAllData()">清除所有数据</button>
                </div>
                <div class="settings-section">
                    <h3>关于</h3>
                    <p class="about-text">房租提醒 v1.0</p>
                    <p class="about-text">帮助房东轻松管理租金账单</p>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-page="home" onclick="switchPage('home')">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">首页</span>
            </button>
            <button class="nav-item" data-page="tenants" onclick="switchPage('tenants')">
                <span class="nav-icon">👥</span>
                <span class="nav-text">房客</span>
            </button>
            <button class="nav-item" data-page="records" onclick="switchPage('records')">
                <span class="nav-icon">📋</span>
                <span class="nav-text">记录</span>
            </button>
            <button class="nav-item" data-page="settings" onclick="switchPage('settings')">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">设置</span>
            </button>
        </nav>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title">添加房客</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal confirm-modal">
            <div class="modal-header">
                <h3 id="confirm-title">确认</h3>
            </div>
            <div class="modal-body">
                <p id="confirm-message"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeConfirmModal()">取消</button>
                <button class="btn btn-danger" id="confirm-btn" onclick="">确定</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
